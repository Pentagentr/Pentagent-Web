version: '3.8'

services:
  backend:
    build: .
    container_name: pentagent-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ENVIRONMENT=production
      - DEBUG=False
    volumes:
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./evidence:/app/evidence
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: node:18-alpine
    container_name: pentagent-frontend
    working_dir: /app
    command: sh -c "cd pentagent-frontend && npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - ./pentagent-frontend:/app/pentagent-frontend
      - /app/pentagent-frontend/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

