services:
  - type: web
    name: pentagent-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://pentagent-b9007.web.app,https://pentagent-b9007.firebaseapp.com
      - key: PYTHON_VERSION
        value: 3.12.0
    healthCheckPath: /health

